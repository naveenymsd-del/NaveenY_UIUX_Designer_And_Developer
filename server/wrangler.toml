# Cloudflare Worker for the portfolio's AI guide — optional; the site works fully without it. See README.md.
name = "naveen-portfolio-guide"
main = "guide.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# the portfolio's origin — only this site may call the endpoint
ALLOWED_ORIGIN = "https://naveenymsd-del.github.io"
# Free text brain: Cloudflare Workers AI (no API key; uses the free daily allocation,
# 10,000 neurons/day on the Workers Free plan — when it runs out, requests fail and
# the browser's built-in brain answers instead; nothing is charged).
# Optional var: WORKERS_AI_MODEL (default @cf/meta/llama-3.3-70b-instruct-fp8-fast;
# @cf/meta/llama-3.1-8b-instruct-fp8 stretches the allocation ~5x further).
#
# Optional paid secrets (never commit them, never put them in the frontend):
#   npx wrangler secret put ANTHROPIC_API_KEY   # text brain (POST /)
#   npx wrangler secret put OPENAI_API_KEY      # realtime voice sessions (POST /realtime/session)
# Optional vars: REALTIME_MODEL (default gpt-realtime-2.1), REALTIME_VOICE (default marin)

[ai]
binding = "AI"
